<section class="panel calculator" (window:keydown)="onKeydown($event)"><div class="heading"><div><p class="eyebrow">Everyday maths, made clear</p><h1>Basic calculator</h1></div><span class="tag">Preview</span></div><div class="display" aria-label="Calculator display" aria-live="polite"><div class="label">Expression</div><div class="expression">{{expression() || '0'}}</div><div class="label">Result</div><div class="result">—</div></div><p class="note">Calculation results arrive with the decimal math engine in Phase 2.</p><div class="keypad" aria-label="Calculator keypad">@for(key of keys;track key){<button type="button" [class.operator]="['÷','×','−','+','%','(',')'].includes(key)" [class.equals]="key==='='" [disabled]="key==='='" [attr.aria-label]="key==='⌫'?'Backspace':key==='AC'?'Clear all':key==='±'?'Toggle sign':key==='='?'Equals, available in Phase 2':key" (click)="press(key)">{{key}}</button>}</div></section>
