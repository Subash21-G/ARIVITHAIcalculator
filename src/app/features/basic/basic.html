<section class="panel calculator" (window:keydown)="onKeydown($event)"><div class="heading"><div><p class="eyebrow">{{i18n.t('everyday')}}</p><h1>{{i18n.t('basicTitle')}}</h1></div></div><div class="display" [attr.aria-label]="i18n.t('displayLabel')" aria-live="polite"><div class="label">{{i18n.t('expression')}}</div><div class="expression">{{expression() || '0'}}</div><div class="label">{{i18n.t('result')}}</div><div class="result">{{displayedResult() || '—'}}</div>@if(resultWords()){<div class="result-words">{{resultWords()}}</div>}@if(error()){<p class="error" role="alert">{{i18n.error(error())}}</p>}</div><p class="note">{{i18n.t('percentHelp')}}</p><div class="keypad" [attr.aria-label]="i18n.t('keypadLabel')">@for(key of keys;track key){<button type="button" [class.operator]="['÷','×','−','+','%','(',')'].includes(key)" [class.equals]="key==='='" [attr.aria-label]="key==='⌫'?i18n.t('backspace'):key==='AC'?i18n.t('clear'):key==='±'?i18n.t('sign'):key==='='?i18n.t('equals'):key" (click)="press(key)">{{key}}</button>}</div></section>
