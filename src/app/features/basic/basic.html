<section class="panel calculator" (window:keydown)="onKeydown($event)"><div class="heading"><div><p class="eyebrow">Everyday maths, made clear</p><h1>Basic calculator</h1></div></div><div class="display" aria-label="Calculator display" aria-live="polite"><div class="label">Expression</div><div class="expression">{{expression() || '0'}}</div><div class="label">Result</div><div class="result">{{result() || '—'}}</div>@if(error()){<p class="error" role="alert">{{error()}}</p>}</div><p class="note">For addition and subtraction, a percent is based on the preceding value. Example: 200 + 10% = 220.</p><div class="keypad" aria-label="Calculator keypad">@for(key of keys;track key){<button type="button" [class.operator]="['÷','×','−','+','%','(',')'].includes(key)" [class.equals]="key==='='" [attr.aria-label]="key==='⌫'?'Backspace':key==='AC'?'Clear all':key==='±'?'Toggle sign':key==='='?'Equals':key" (click)="press(key)">{{key}}</button>}</div></section>
