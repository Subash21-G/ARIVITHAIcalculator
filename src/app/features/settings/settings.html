<section class="panel tool"><p class="eyebrow">ARIVITHAI</p><h1>{{i18n.t('settings')}}</h1><p class="intro">{{i18n.t('settingsIntro')}}</p><div class="settings-fields"><label>{{i18n.t('language')}}<select [value]="store.language()" (change)="setLanguage($event)"><option value="en">English</option><option value="ta">தமிழ்</option></select></label><label>{{i18n.t('theme')}}<select [value]="store.theme()" (change)="setTheme($event)"><option value="system">{{i18n.t('system')}}</option><option value="light">{{i18n.t('light')}}</option><option value="dark">{{i18n.t('dark')}}</option></select></label><label>{{i18n.t('decimalDisplay')}}<select [value]="store.decimalDisplay()" (change)="setDecimalDisplay($event)"><option value="auto">{{i18n.t('fullPrecision')}}</option><option value="2">{{i18n.t('twoDecimals')}}</option></select></label></div></section>
