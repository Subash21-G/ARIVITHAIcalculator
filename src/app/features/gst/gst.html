<section class="panel tool">
  <p class="eyebrow">ARIVITHAI</p><h1>{{i18n.t('gstTitle')}}</h1><p class="intro">{{i18n.t('gstIntro')}}</p>
  <form (submit)="submit($event)">
    <label>{{i18n.t('amount')}}<input type="text" inputmode="decimal" autocomplete="off" [value]="amount()" (input)="setAmount($event)" aria-describedby="gst-amount-help"></label>
    <small id="gst-amount-help">{{i18n.t('gstAmountHelp')}}</small>
    <label>{{i18n.t('gstRate')}}<input type="text" inputmode="decimal" autocomplete="off" [value]="rate()" (input)="setRate($event)"></label>
    <label>{{i18n.t('calculation')}}<select [value]="mode()" (change)="setMode($event)"><option value="exclusive">{{i18n.t('addGst')}}</option><option value="inclusive">{{i18n.t('removeGst')}}</option></select></label>
    <button class="primary" type="submit">{{i18n.t('calculateGst')}}</button>
  </form>
  @if(error()){<p class="form-error" role="alert">{{error()}}</p>}
  @if(result();as r){<div class="breakdown" aria-live="polite"><h2>{{i18n.t('breakdown')}}</h2><dl><div><dt>{{i18n.t('baseAmount')}}</dt><dd>₹{{r.base}}</dd></div><div><dt>{{i18n.t('gstAmount')}}</dt><dd>₹{{r.tax}}</dd></div><div class="total"><dt>{{i18n.t('total')}}</dt><dd>₹{{r.total}}</dd></div></dl><button type="button" class="secondary" (click)="copy()">{{copied()?i18n.t('copied'):i18n.t('copyTotal')}}</button></div>}
  <p class="fine-print">{{i18n.t('gstFine')}}</p>
</section>
